# ==========================================================================
#  MikuHAProxy 代理来源白名单          作者：JunXieX
# --------------------------------------------------------------------------
#  只有「TCP 对端地址」出现在这里的连接，它发来的 PROXY 头才会被采信。
#
#  请特别注意：这里判断的是【发起 TCP 连接的那台机器的地址】（也就是你的
#  HAProxy 服务器），而不是 PROXY 头里声明的客户端地址。后者由发送方自己
#  填写，可以随意伪造，不具备任何安全意义；只有 TCP 对端地址无法伪造。
#
#  每行一条，支持以下写法：
#
#      127.0.0.1            单个 IPv4
#      ::1                  单个 IPv6
#      127.0.0.0/8          IPv4 网段（CIDR）
#      fd00::/8             IPv6 网段（CIDR）
#      proxy.example.com    域名：启动时解析一次，A / AAAA 记录全部纳入。
#                           域名不能带 /前缀（一个域名可能同时有 v4 和 v6 地址，
#                           前缀长度无法统一表达）。
#                           注意：解析是【阻塞】的。写了域名而 DNS 又不可达时，
#                           启动与 /mikuproxy reload 会各自卡住数秒（代理本身不受影响）。
#                           只写 IP 字面量则完全不会有这个开销。
#
#  '#' 及其之后的内容是注释；空行会被忽略。
#  某一行写错只会跳过该行、并在控制台提示「第几行、什么内容、什么问题」，
#  不会导致插件加载失败。
#
#  【重要】白名单为空 = 拒绝所有代理连接（只保留直连），这是安全默认值。
#  但下面文件末尾的 127.0.0.0/8 与 ::1/128 是【出厂即放行】的两条回环规则，
#  这是有意的信任，不是「默认安全」的一部分：
#    · 理由：绝大多数部署把 HAProxy 与本代理放在同一台机器上，此时 TCP 对端就是
#      127.0.0.1，不放行的话插件装完即不可用。
#    · 代价：本机上任何能连到这个端口的进程，都可以发一个「我来自任意 IP」的
#      PROXY 头并被采信。若这台机器上有不受信任的其他用户、或代理端口的内网
#      暴露面超出预期，请删掉这两条，改成只写 HAProxy 的实际地址。
# ==========================================================================

# 本机回环（出厂默认放行；理由与代价见文件开头的说明）。
# HAProxy 与 Velocity 装在同一台机器上时，一般只需要下面这两条。
127.0.0.0/8
::1/128

# 示例：内网里另一台服务器上的 HAProxy
# 192.168.1.10
# 10.0.0.0/8

# 示例：用域名，会跟随 DNS 解析结果（解析发生在启动时 / 执行 reload 时）
# proxy.example.com
