# ==========================================================================
#  MikuHAProxy 配置文件          作者：JunXieX
# --------------------------------------------------------------------------
#  本文件只使用「key = value」这一种最简形式：没有嵌套表、没有数组。
#  好处是解析不需要任何第三方 TOML 库（没有依赖风险），而且任何写法错误
#  都能被精确报告到行号，并安全地回退到默认值——不会让插件加载失败。
#
#  修改后执行 /mikuproxy reload 即可生效，不需要重启代理。
#  注意：重载只影响「之后新建」的连接，已经建立的连接不受影响。
# ==========================================================================

# 是否放行「任何来源」的代理连接。
#
# 【极度危险 —— 生产环境绝对不要开启】
# 关闭白名单后，任何人都可以自己架一个 HAProxy 向你的代理发送 PROXY 头，
# 从而伪造玩家的真实 IP，使 IP 封禁、登录限制、风控全部失效。
# 只有在完全隔离、不对公网暴露的测试环境里才可以考虑打开。
allow-all-proxies = false

# 白名单文件的路径。
# 相对路径相对于插件数据目录（plugins/MikuHAProxy/）；也可以写绝对路径。
# 文件格式见同目录下的 whitelist.conf。
#
# 白名单只决定「谁的 PROXY 头可以被采信」，它不限制直连：任何能连到代理端口的
# 地址都仍然可以直连进来。如果你的代理端口对公网开放，请用防火墙单独控制直连来源。
whitelist-file = "whitelist.conf"

# 是否输出「代理连接被拒绝」与「判定过程发生异常」这两类日志。
# 建议保持开启：这是发现「有人在伪造 IP」或「自己白名单配错了」的第一手线索。
# 关闭后两类日志都不再输出（异常日志同样是攻击者可以制造的，只关一半等于留了后门），
# 但次数仍可在 /mikuproxy status 的「拒绝」「异常」计数里看到。
log-rejected-connections = true

# 是否输出「代理连接被接受」的日志（每一条代理连接都会打印一行）。
# 平时建议关闭，排查问题时再临时打开。
log-accepted-connections = false

# 同一个来源地址的「拒绝日志」最短间隔，单位秒。取值范围 0 ~ 86400。
# 攻击者会成批轮换源 IP 来刷日志，这个间隔可以避免日志被淹没、磁盘被写满。
# 设为 0 表示不做限流（每个被拒绝的连接都会打日志，不推荐）。
rejected-log-interval-seconds = 60

# 日志限流器最多同时跟踪多少个来源地址。取值范围 16 ~ 1000000。
# 超出上限时会先清理过期记录，若仍然超限则整体清空，保证内存占用始终有上界。
rejected-log-max-tracked = 4096
